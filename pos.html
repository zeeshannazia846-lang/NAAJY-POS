<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1b1f23;--mu:#6b7280;--ac:#0f766e;--acx:#fff;--bd:#e5e7eb;--warn:#d97706;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111416;--card:#1b1f23;--tx:#eceff1;--mu:#9aa3ab;--ac:#2dd4bf;--acx:#06201c;--bd:#2c3238;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#111416;--card:#1b1f23;--tx:#eceff1;--mu:#9aa3ab;--ac:#2dd4bf;--acx:#06201c;--bd:#2c3238;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:240px}
h1{font-size:20px;margin:0;padding:14px 16px}
main{padding:0 12px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row small{display:block;color:var(--mu);margin-top:2px}
.row.off{opacity:.45}
.qty{display:flex;align-items:center;gap:10px;font-size:18px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.qty button{padding:4px 12px;font-size:20px}
input,select{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.big{font-size:26px;font-weight:700}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.low{color:var(--warn)}
h3{margin:16px 4px 8px;font-size:15px;color:var(--mu)}
#bar{background:var(--bg);position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:8px 12px}
#bar button{width:100%;padding:15px;font-size:18px}
#bar button:disabled{opacity:.4}
#bar input{margin:0}#bar select{width:auto;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}
nav button.on{color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#scan{z-index:8}
.box{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:400px;max-height:92vh;overflow:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts button{flex:1;min-width:40%}
video{width:100%;border-radius:10px;background:#000;max-height:45vh}
.qr{width:100%;max-width:300px;display:block;margin:8px auto;border-radius:8px;background:#fff}
.rc{background:#fff;color:#222;font:13px ui-monospace,Menlo,Consolas,monospace;padding:16px 14px;border-radius:8px;margin-bottom:10px}
.rc h2{font:500 22px system-ui,sans-serif;letter-spacing:2px;text-align:center;margin:0 0 6px}
.rc .ctr{text-align:center;margin-bottom:6px}
.ln{display:flex;justify-content:space-between;gap:8px}
.dash{border-top:1px dashed #888;margin:8px 0}
.it{display:grid;grid-template-columns:34px 1fr auto;gap:6px}
.rc .hd{font-weight:700}
#prt{display:none}
@media print{body>*{display:none!important}body>#prt{display:block!important}@page{margin:2mm}}
</style>
</head>
<body>
<h1 id="title"></h1>
<main id="view"></main>
<div id="bar"></div>
<nav id="nav"></nav>

<div id="scan" class="ov"><div class="box"><video id="vid" playsinline muted></video><button id="tbtn" disabled style="width:100%;padding:16px;font-size:18px;margin-top:8px" onclick="toggleTorch()">🔦 Flash light</button><p id="smsg" style="color:var(--mu);margin:8px 0"></p><input id="mcode" placeholder="Ya code yahan type karein" onkeydown="if(event.key==='Enter'){scanCb&&scanCb(this.value);this.value=''}"><div class="acts"><button class="g" onclick="closeScan()">Done</button></div></div></div>

<div id="ed" class="ov"><div class="box" id="edb"></div></div>
<div id="co" class="ov"><div class="box" id="cob"></div></div>

<div id="modal" class="ov"><div class="box"><div id="rcv"></div>
<div class="acts"><button onclick="doPrint(cur)">🖨 Print</button><button onclick="btPrint(cur)">Bluetooth print</button><button class="g" onclick="shareR()">Share</button><button class="g" onclick="closeM()">Close</button></div>
<small id="mh" style="display:block;color:var(--mu);margin-top:8px"></small></div></div>
<div id="prt"></div>

/* ---------- beep + scan ---------- */
let actx=null;
function beep(ok){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='square';o.frequency.value=ok?1800:400;g.gain.value=0.15;
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(ok?0.12:0.3));
  }catch(e){}
}
let stream=null,scanOn=false,scanCb=null,lastCode='',lastT=0;
function toast(m){const a=$('#smsg'),b=$('#hint');if(a)a.textContent=m;if(b)b.textContent=m}
async function openScan(cb){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  scanCb=cb;$('#scan').style.display='flex';toast('Camera khul raha hai…');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#vid');v.srcObject=stream;await v.play();setupTorch();
    const nat='BarcodeDetector' in window;const det=nat?new BarcodeDetector():new ZXing.BrowserMultiFormatReader();scanOn=true;toast('Barcode camera ke samne rakhein');
    const loop=async()=>{
      if(!scanOn)return;
      try{let c='';if(nat){const r=await det.detect(v);if(r.length)c=r[0].rawValue}else{try{c=det.decode(v).getText()}catch(z){}}if(c){if(c!==lastCode||Date.now()-lastT>2500){lastCode=c;lastT=Date.now();scanCb(c)}}}catch(e){}
      setTimeout(loop,250);
    };
    loop();
  }catch(e){
    toast(e.name==='NotAllowedError'||e.name==='SecurityError'?'Camera permission block hai. Is link ko seedha Chrome mein kholein aur Allow dabayein. Tab tak code neeche type karein.':'Camera nahi khula ('+(e.name||'error')+'). Code neeche type karein.');
  }
}
let torchOn=false;
const torchTrack=()=>stream&&stream.getVideoTracks()[0];
function setupTorch(){
  const b=$('#tbtn'),t=torchTrack();torchOn=false;
  let ok=false;try{ok=!!(t&&t.getCapabilities&&t.getCapabilities().torch)}catch(e){}
  b.disabled=!ok;b.style.opacity=ok?1:.5;
  b.textContent=ok?'🔦 Flash light ON karein':'Is phone mein flash light available nahi';
}
async function toggleTorch(){
  const t=torchTrack();if(!t)return;
  try{
    await t.applyConstraints({advanced:[{torch:!torchOn}]});
    torchOn=!torchOn;
    $('#tbtn').textContent=torchOn?'🔦 Flash light OFF karein':'🔦 Flash light ON karein';
  }catch(e){toast('Flash light nahi chali')}
}
function closeScan(){torchOn=false;scanOn=false;lastCode='';if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#scan').style.display='none'}
function scanAdd(code){
  code=String(code).trim();if(!code)return false;
  const i=items.find(x=>x.barcode===code);
  if(!i){beep(false);toast('Item nahi mila: '+code);return false}
  if((cart[i.id]||0)>=i.stock){beep(false);toast(i.name+': stock khatam');return false}
  add(i.id);beep(true);toast('Added: '+i.name);
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
  return true;
}
const scanBar=`<div style="display:flex;gap:8px"><input id="bc" placeholder="Scan / type barcode" inputmode="numeric" onkeydown="if(event.key==='Enter'){if(scanAdd(this.value))setTimeout(()=>$('#bc')&&$('#bc').focus(),0)}"><button style="margin-bottom:8px;white-space:nowrap" onclick="openScan(scanAdd)">📷 Scan</button></div><small id="hint" style="display:block;color:var(--mu);margin:-2px 4px 8px"></small>`;

function coRender(){
  const t=net();

  if(payM==='QR'){

function charge(){

    const n=q.getModuleCount(),cell=Math.floor(300/(n+4)),size=cell*(n+4),c=document.createElement('canvas');

  x.fillStyle='#000';RR(M,y,232,52,26,true);RR(470,y,128,52,26,true);
  x.fillStyle='#fff';F('bold',28);T('Receipt No:',M+116,y+27,'center');T('Date:',534,y+27,'center');

  y+=70;
  /* customer */
  x.fillStyle='#000';x.beginPath();x.arc(48,y+4,11,0,7);x.fill();x.beginPath();x.arc(48,y+36,20,Math.PI,0);x.fill();
  F('bold',32);T('Customer Name:',80,y+18);
  x.strokeStyle='#000';x.lineWidth=3;L(332,y+34,RW-M,y+34);x.lineWidth=2;L(110,y+46,RW-M,y+46);
  if(s.cust){F('normal',30);T(fit(s.cust,RW-M-352),342,y+16)}
  y+=68;
  /* table */
  const cw=[60,290,100,150,192],hx=[M];for(const w of cw)hx.push(hx[hx.length-1]+w);
  const hh=56,rh=58,nr=Math.max(3,s.lines.length);
  x.fillStyle='#000';RR(M,y,PW,hh,[14,14,0,0],true);
  x.fillStyle='#fff';F('bold',28);
  ['#','Product Description','Qty','Unit Price','Total'].forEach((t,i)=>T(t,hx[i]+cw[i]/2,y+hh/2+1,'center'));
  x.strokeStyle='#fff';x.lineWidth=3;for(let i=1;i<5;i++)L(hx[i],y+6,hx[i],y+hh-6);
  x.strokeStyle='#000';x.lineWidth=3;
  const ty=y+hh;RR(M+1.5,ty,PW-3,rh*nr,[0,0,14,14],false);
  for(let r=1;r<nr;r++)L(M,ty+r*rh,M+PW,ty+r*rh);
  for(let i=1;i<5;i++)L(hx[i],ty,hx[i],ty+rh*nr);
  x.fillStyle='#000';
  for(let r=0;r<nr;r++){
    const l=s.lines[r],cy=ty+r*rh+rh/2+1;F('bold',30);T(String(r+1),hx[0]+cw[0]/2,cy,'center');
    if(l){F('bold',28);T(fit(l.name,cw[1]-16),hx[1]+10,cy);T(String(l.qty),hx[2]+cw[2]/2,cy,'center');T(fmt(l.price),hx[3]+cw[3]/2,cy,'center');T(fmt(l.qty*l.price),hx[4]+cw[4]/2,cy,'center')}
  }
  y=ty+rh*nr+16;
  /* totals */
  const box=(lab,val,py,wl)=>{
    const vx=RW-M-170,lx=vx-wl;
    x.fillStyle='#000';RR(lx,py,wl,50,[25,0,0,25],true);
    x.fillStyle='#fff';F('bold',28);T(lab,lx+wl/2,py+26,'center');
    x.strokeStyle='#000';x.lineWidth=3;RR(vx,py,170,50,[0,25,25,0],false);
    x.fillStyle='#000';F('bold',28);T(val,RW-M-12,py+26,'right');
  };
  box('Sub Total:',fmt(s.sub),y,230);y+=62;
  box('Discount:',fmt(s.disc||0),y,230);y+=62;
  box('Total Amount:',fmt(s.total),y,250);y+=60;
  x.fillStyle='#000';F('normal',22);
  const pm=(s.pay||'Cash')==='Cash'?('Paid by: Cash'+(s.cash>0?'   Received: '+fmt(s.cash)+'   Change: '+fmt(Math.max(0,s.cash-s.total)):'')):'Paid by: '+s.pay;
  T(pm,RW-M,y+4,'right');y+=36;
  /* bottom: contact + QR payment */
  const by=y+8;
  if(IMG.wa)x.drawImage(IMG.wa,M+4,by+4,100,Math.round(100*IMG.wa.height/IMG.wa.width));
  x.strokeStyle='#000';x.lineWidth=3;L(150,by+8,150,by+120);
  x.fillStyle='#000';F('bold',36);T(cfg.tel||'',172,by+36);if(cfg.tel2)T(cfg.tel2,172,by+92);
  if(IMG.pin)x.drawImage(IMG.pin,M+14,by+170,64,Math.round(64*IMG.pin.height/IMG.pin.width));
  F('bold',30);
  const words=String(cfg.addr||'').split(' ');const lines=[''];
  for(const w of words){const t=(lines[lines.length-1]+' '+w).trim();if(x.measureText(t).width>290&&lines[lines.length-1])lines.push(w);else lines[lines.length-1]=t}
  lines.slice(0,4).forEach((t,i)=>T(t,108,by+180+i*38));
  x.lineWidth=3;L(428,by,428,by+330);
  const bx=452,bw=RW-M-bx,bh=330;
  x.fillStyle='#000';RR(bx,by,bw,46,[12,12,0,0],true);
  x.fillStyle='#fff';F('bold',27);T('QR Payment',bx+bw/2,by+24,'center');
  x.strokeStyle='#000';x.lineWidth=3;RR(bx+1.5,by+46,bw-3,bh-46,[0,0,12,12],false);
  const pq=qrs.find(q=>q.id===cfg.rq);
  if(pq){
    const im=await loadImg(pq.img);
    if(im){const a=bw-30,b2=bh-46-30,k=Math.min(a/im.width,b2/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,bx+(bw-w)/2,by+46+(bh-46-h)/2,w,h)}
  }else{
    const c0=[bx+26,by+46+24],c1=[bx+bw-26,by+bh-24],q=34;x.lineWidth=5;
    [[c0[0],c0[1],1,1],[c1[0],c0[1],-1,1],[c0[0],c1[1],1,-1],[c1[0],c1[1],-1,-1]].forEach(([px,py,sx,sy])=>{x.beginPath();x.moveTo(px+sx*q,py);x.lineTo(px,py);x.lineTo(px,py+sy*q);x.stroke()});
  }
  y=by+bh+26;
  /* footer: For any query + WhatsApp QR */
  const my=y+30;x.strokeStyle='#000';x.lineWidth=4;L(M,my,270,my);L(562,my,RW-M,my);
  x.fillStyle='#000';RR(292,my-30,248,60,30,true);
  x.fillStyle='#fff';F('bold',36,true);T('For any query',416,my+1,'center');
  y=my+50;
  const wq=waCanvas(cfg.wa);
  if(wq){const sz=300;x.drawImage(wq,(RW-sz)/2,y,sz,sz);y+=sz+8;x.fillStyle='#000';F('bold',24);T('Scan to chat on WhatsApp',RW/2,y+10,'center');y+=34}
  y+=14;
  const out=document.createElement('canvas');out.width=RW;out.height=Math.ceil(y);
  const ox=out.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,RW,out.height);ox.drawImage(cv,0,0,RW,out.height,0,0,RW,out.height);
  return out;
}
async function showR(s){
  cur=s;$('#mh').textContent='';$('#modal').style.display='flex';
  $('#rcv').innerHTML='<p class="empty">Receipt ban rahi hai…</p>';
  curCv=await drawReceipt(s);
  $('#rcv').innerHTML='<img src="'+curCv.toDataURL('image/png')+'" style="width:100%;background:#fff;border-radius:6px;margin-bottom:10px;display:block">';
}
function closeM(){$('#modal').style.display='none'}
function msg(t){$('#mh').textContent=t}
async function shareR(){
  try{
    if(!curCv)return;
    const b=await new Promise(r=>curCv.toBlob(r,'image/png'));
    const f=new File([b],'receipt-'+cur.id+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
    else msg('Is browser mein share nahi chalta. Print ya Bluetooth print use karein.');
  }catch(e){}
}
async function doPrint(s){
  if(!s)return;
  const cv=await drawReceipt(s),p=$('#prt');
  p.style.width=(cfg.w==101?'4in':cfg.w+'mm');
  p.innerHTML='<img src="'+cv.toDataURL('image/png')+'" style="width:100%;display:block">';
  setTimeout(()=>{try{window.print()}catch(e){msg('Is page par print block hai. Apni GitHub website se try karein.')}},300);
}
function toRaster(cv,dots){
  const h=Math.round(cv.height*dots/cv.width),c=document.createElement('canvas');c.width=dots;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,dots,h);x.imageSmoothingQuality='high';x.drawImage(cv,0,0,dots,h);
  const d=x.getImageData(0,0,dots,h).data,bw=dots/8,out=[];
  for(let y0=0;y0<h;y0+=128){
    const bh=Math.min(128,h-y0);out.push(0x1d,0x76,0x30,0,bw&255,bw>>8,bh&255,bh>>8);
    for(let y=y0;y<y0+bh;y++)for(let b=0;b<bw;b++){let v=0;for(let j=0;j<8;j++){const p=(y*dots+b*8+j)*4;v=(v<<1)|(((d[p]+d[p+1]+d[p+2])/3)<175?1:0)}out.push(v)}
  }
  return out;
}
async function btPrint(s){
  if(!s)return;
  try{
    if(!navigator.bluetooth){msg('Is browser mein Bluetooth print nahi. Android Chrome mein apni GitHub website kholein.');return}
    if(!btChar){
      msg('Printer chunein…');
      const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xff00,0xffe0,0x18f0,'49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2']});
      const srv=await dev.gatt.connect();
      for(const sv of await srv.getPrimaryServices()){
        for(const ch of await sv.getCharacteristics()){if(ch.properties.write||ch.properties.writeWithoutResponse){btChar=ch;break}}
        if(btChar)break;
      }
      if(!btChar)throw new Error('Printer ka write channel nahi mila');
    }
    msg('Receipt bhej raha hoon…');
    const cv=await drawReceipt(s),dots=cfg.w==101?832:cfg.w==80?576:384,r=toRaster(cv,dots);
    const data=new Uint8Array(2+r.length+4);data.set([0x1b,0x40]);data.set(r,2);data.set([0x0a,0x0a,0x0a,0x0a],2+r.length);
    for(let i=0;i<data.length;i+=100){
      const part=data.slice(i,i+100);
      if(btChar.properties.writeWithoutResponse)await btChar.writeValueWithoutResponse(part);else await btChar.writeValue(part);
      await new Promise(z=>setTimeout(z,20));
    }
    msg('Print bhej di gayi');
  }catch(e){btChar=null;msg('Print nahi hui: '+(e.message||e.name))}
}

/* ---------- items ---------- */
function addItem(){
  const n=$('#n').value.trim();if(!n)return;
  const bc=$('#b').value.trim();
  if(bc&&items.some(i=>i.barcode===bc)){$('#n').placeholder='Ye barcode pehle se hai';$('#b').value='';return}
  const id=items.reduce((m,i)=>Math.max(m,i.id),0)+1;
  items.push({id,name:n,barcode:bc,cost:parseFloat($('#c').value)||0,price:parseFloat($('#p').value)||0,stock:parseInt($('#s').value)||0});
  items.sort((a,b)=>a.name.localeCompare(b.name));save();render();
}
function openEd(id){
  const i=find(id);if(!i)return;
  $('#edb').innerHTML=`<h3 style="margin:0 0 10px;color:var(--tx);font-size:18px">Edit item</h3><input id="e_n" value="${esc(i.name)}" placeholder="Name"><div style="display:flex;gap:8px"><input id="e_b" value="${esc(i.barcode||'')}" placeholder="Barcode" inputmode="numeric"><button class="g" style="margin-bottom:8px" onclick="openScan(c=>{beep(true);$('#e_b').value=c;closeScan()})">📷</button></div><input id="e_c" type="number" inputmode="decimal" value="${i.cost||0}" placeholder="Purchase price (kharid)"><div class="grid"><input id="e_p" type="number" inputmode="decimal" value="${i.price}" placeholder="Sale price"><input id="e_s" type="number" inputmode="numeric" value="${i.stock}" placeholder="Stock"></div><div class="acts"><button class="g" onclick="$('#ed').style.display='none'">Cancel</button><button onclick="saveEd(${id})">Save</button></div>`;
  $('#ed').style.display='flex';
}
function saveEd(id){
  const i=find(id),n=$('#e_n').value.trim(),bc=$('#e_b').value.trim();
  if(!n)return;
  if(bc&&items.some(x=>x.id!==id&&x.barcode===bc)){$('#e_b').value='';$('#e_b').placeholder='Ye barcode pehle se hai';return}
  i.name=n;i.barcode=bc;i.cost=parseFloat($('#e_c').value)||0;i.price=parseFloat($('#e_p').value)||0;i.stock=parseInt($('#e_s').value)||0;
  if(cart[id]>i.stock){if(i.stock>0)cart[id]=i.stock;else delete cart[id]}
  items.sort((a,b)=>a.name.localeCompare(b.name));save();$('#ed').style.display='none';render();
}
function restock(id){find(id).stock+=10;save();render()}
function del(id){
  if(delId!==id){delId=id;render();return}
  items=items.filter(i=>i.id!==id);delete cart[id];delId=null;save();render();
}
function addQR(inp){
  const f=inp.files[0],bank=$('#qn').value.trim();inp.value='';
  if(!f)return;
  if(!bank){$('#qh').textContent='Pehle bank ka naam likhein, phir image chunein.';return}
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const k=Math.min(1,600/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    qrs.push({id:Date.now(),bank,img:c.toDataURL('image/jpeg',.9)});
    URL.revokeObjectURL(u);S.set('qrs',qrs);render();
  };
  img.src=u;
}

/* ---------- views ---------- */
function vSale(){
  if(!items.length)return '<p class="empty">Pehle Items tab mein item add karein.</p>';
  return items.map(i=>{const q=cart[i.id]||0;
    return `<div class="row ${i.stock<1?'off':''}" onclick="add(${i.id})"><div><b>${esc(i.name)}</b><small>${rs(i.price)} · Stock ${i.stock}</small></div>${q?`<div class="qty"><button onclick="event.stopPropagation();sub(${i.id})">−</button><b>${q}</b></div>`:''}</div>`}).join('');
}
function vItems(){
  const form=`<div class="card"><input id="n" placeholder="Item name"><div style="display:flex;gap:8px"><input id="b" placeholder="Barcode (optional)" inputmode="numeric"><button class="g" style="margin-bottom:8px" onclick="openScan(c=>{beep(true);$('#b').value=c;closeScan()})">📷</button></div><input id="c" type="number" inputmode="decimal" placeholder="Purchase price (kharid)"><div class="grid"><input id="p" type="number" inputmode="decimal" placeholder="Sale price"><input id="s" type="number" inputmode="numeric" placeholder="Stock"></div><button style="width:100%" onclick="addItem()">Add item</button></div>`;
  return form+items.map(i=>`<div class="row"><div><b>${esc(i.name)}</b><small>Sale ${rs(i.price)} · Kharid ${rs(i.cost||0)}${i.barcode?' · '+esc(i.barcode):''} · Stock <span class="${i.stock<=5?'low':''}">${i.stock}${i.stock<=5?' ⚠':''}</span></small></div><div class="acts" style="flex-wrap:nowrap"><button class="g" style="min-width:0;padding:8px 10px" onclick="openEd(${i.id})">Edit</button><button class="g" style="min-width:0;padding:8px 10px" onclick="restock(${i.id})">+10</button><button class="g" style="min-width:0;padding:8px 10px" onclick="del(${i.id})">${delId===i.id?'Sure?':'Delete'}</button></div></div>`).join('');
}
function vReport(){
  const today=new Date().toDateString();
  const ts=sales.filter(s=>new Date(s.date).toDateString()===today);
  const sum=ts.reduce((a,s)=>a+s.total,0);
  const prof=ts.reduce((a,s)=>a+s.total-s.lines.reduce((b,l)=>b+l.qty*(l.cost||0),0),0);
  const top={};ts.forEach(s=>s.lines.forEach(l=>top[l.name]=(top[l.name]||0)+l.qty));
  const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const low=items.filter(i=>i.stock<=5);
  return `<div class="grid"><div class="card"><small>Today’s sales</small><div class="big">${rs(sum)}</div></div><div class="card"><small>Orders</small><div class="big">${ts.length}</div></div></div><div class="card"><small>Profit (munafa)</small><div class="big">${rs(prof)}</div></div>
  <h3>TOP ITEMS TODAY</h3>${tl.length?tl.map(([n,q])=>`<div class="row"><b>${esc(n)}</b><span>${q} sold</span></div>`).join(''):'<p class="empty">Aaj koi sale nahi.</p>'}
  <h3>LOW STOCK</h3>${low.length?low.map(i=>`<div class="row"><b>${esc(i.name)}</b><span class="low">${i.stock} left</span></div>`).join(''):'<p class="empty">Sab theek hai.</p>'}
  <h3>TODAY’S RECEIPTS</h3>${ts.slice().reverse().map(s=>`<div class="row" onclick="showR(sales.find(x=>x.id==${s.id}))"><div><b>#${s.id}</b><small>${new Date(s.date).toLocaleTimeString()} · ${esc(s.pay||'Cash')}</small></div><b>${rs(s.total)}</b></div>`).join('')}`;
}
function vSet(){
  const f=(k,p,t)=>`<input placeholder="${p}" value="${esc(cfg[k]||'')}" ${t||''} oninput="cfg.${k}=this.value;S.set('cfg',cfg)">`;
  return `<div class="card"><h3 style="margin:0 0 8px">Receipt details</h3>${f('addr','Address')}${f('tel','Phone / WhatsApp 1','inputmode="tel"')}${f('tel2','Phone 2','inputmode="tel"')}${f('wa','WhatsApp number for QR (jaise 923044260261)','inputmode="numeric"')}<small style="display:block;color:var(--mu);margin:0 2px 8px">Receipt paper: 58mm (57mm roll)</small><select onchange="cfg.rq=+this.value;S.set('cfg',cfg)"><option value="0">QR Payment: koi nahi</option>${qrs.map(q=>`<option value="${q.id}" ${cfg.rq==q.id?'selected':''}>QR Payment: ${esc(q.bank)}</option>`).join('')}</select></div>
  <div class="card"><h3 style="margin:0 0 8px">Bank QR (scan to pay)</h3><input id="qn" placeholder="Bank ka naam (jaise HBL, Easypaisa)"><input id="qf" type="file" accept="image/*" hidden onchange="addQR(this)"><button style="width:100%" onclick="$('#qf').click()">Upload QR image</button><small id="qh" style="display:block;color:var(--mu);margin-top:6px"></small>
  ${qrs.map(q=>`<div class="row" style="margin-top:8px"><div style="display:flex;gap:10px;align-items:center"><img src="${q.img}" style="width:48px;height:48px;border-radius:6px"><b>${esc(q.bank)}</b></div><button class="g" onclick="qrs=qrs.filter(x=>x.id!==${q.id});S.set('qrs',qrs);render()">Delete</button></div>`).join('')}</div>`;
}

function render(){
  $('#title').textContent={sale:'Sale',items:'Items',report:'Daily report',set:'Settings'}[tab];
  $('#view').innerHTML=(tab==='sale'&&items.length?scanBar:'')+{sale:vSale,items:vItems,report:vReport,set:vSet}[tab]();
  const t=total();
  $('#bar').innerHTML=tab==='sale'?`<div style="display:flex;gap:8px;margin-bottom:6px"><input id="dv" type="number" inputmode="decimal" placeholder="Discount (jitna chahein)" value="${discV||''}" oninput="discV=parseFloat(this.value)||0;updBar()"><select onchange="discT=this.value;updBar()"><option ${discT==='Rs'?'selected':''}>Rs</option><option ${discT==='%'?'selected':''}>%</option></select></div><small id="dl" style="display:block;color:var(--mu);margin-bottom:6px"></small><button id="cb" ${t?'':'disabled'} onclick="openCO()">Charge ${rs(net())}</button>`:'';
  updBar();
  $('#nav').innerHTML=[['sale','🛒','Sale'],['items','📦','Items'],['report','📊','Report'],['set','⚙️','Settings']].map(([k,e,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';delId=null;render()">${e}<br>${l}</button>`).join('');
}
render();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
