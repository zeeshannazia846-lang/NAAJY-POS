<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My POS</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1b1f23;--mu:#6b7280;--ac:#0f766e;--acx:#fff;--bd:#e5e7eb;--warn:#d97706;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111416;--card:#1b1f23;--tx:#eceff1;--mu:#9aa3ab;--ac:#2dd4bf;--acx:#06201c;--bd:#2c3238;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#111416;--card:#1b1f23;--tx:#eceff1;--mu:#9aa3ab;--ac:#2dd4bf;--acx:#06201c;--bd:#2c3238;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:240px}
h1{font-size:20px;margin:0;padding:14px 16px}
main{padding:0 12px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row small{display:block;color:var(--mu);margin-top:2px}
.row.off{opacity:.45}
.qty{display:flex;align-items:center;gap:10px;font-size:18px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.qty button{padding:4px 12px;font-size:20px}
input,select{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.big{font-size:26px;font-weight:700}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.low{color:var(--warn)}
h3{margin:16px 4px 8px;font-size:15px;color:var(--mu)}
#bar{background:var(--bg);position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:8px 12px}
#bar button{width:100%;padding:15px;font-size:18px}
#bar button:disabled{opacity:.4}
#bar input{margin:0}#bar select{width:auto;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}
nav button.on{color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
.box{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:400px;max-height:92vh;overflow:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts button{flex:1;min-width:40%}
video{width:100%;border-radius:10px;background:#000;max-height:45vh}
.qr{width:100%;max-width:300px;display:block;margin:8px auto;border-radius:8px;background:#fff}
.rc{background:#fff;color:#222;font:13px ui-monospace,Menlo,Consolas,monospace;padding:16px 14px;border-radius:8px;margin-bottom:10px}
.rc h2{font:500 22px system-ui,sans-serif;letter-spacing:2px;text-align:center;margin:0 0 6px}
.rc .ctr{text-align:center;margin-bottom:6px}
.ln{display:flex;justify-content:space-between;gap:8px}
.dash{border-top:1px dashed #888;margin:8px 0}
.it{display:grid;grid-template-columns:34px 1fr auto;gap:6px}
.rc .hd{font-weight:700}
#prt{display:none}
@media print{body>*{display:none!important}body>#prt{display:block!important}@page{margin:2mm}}
</style>
</head>
<body>
<h1 id="title"></h1>
<main id="view"></main>
<div id="bar"></div>
<nav id="nav"></nav>

<div id="scan" class="ov"><div class="box"><video id="vid" playsinline muted></video><p id="smsg" style="color:var(--mu);margin:8px 0"></p><input id="mcode" placeholder="Ya code yahan type karein" onkeydown="if(event.key==='Enter'){scanCb&&scanCb(this.value);this.value=''}"><div class="acts"><button class="g" onclick="closeScan()">Done</button></div></div></div>

<div id="co" class="ov"><div class="box" id="cob"></div></div>

<div id="modal" class="ov"><div class="box"><div id="rcv"></div>
<div class="acts"><button onclick="doPrint(cur)">🖨 Print</button><button onclick="btPrint(cur)">Bluetooth print</button><button class="g" onclick="shareR()">Share</button><button class="g" onclick="closeM()">Close</button></div>
<small id="mh" style="display:block;color:var(--mu);margin-top:8px"></small></div></div>
<div id="prt"></div>

<script>
let mem={};
const S={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let items=S.get('items',[]),sales=S.get('sales',[]),qrs=S.get('qrs',[]);
let cfg=Object.assign({name:'',addr:'',tel:'',w:58,rq:0},S.get('cfg',{}));if(!cfg.v2){cfg.w=58;cfg.v2=1}
let cart={},tab='sale',delId=null,discV=0,discT='Rs',payM='Cash',payBank=0,cashRcv=0,cur=null,btChar=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>'Rs '+Math.round(n).toLocaleString();
const save=()=>{S.set('items',items);S.set('sales',sales)};
const find=id=>items.find(i=>i.id==id);
const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+find(id).price*q,0);
const discAmt=()=>Math.min(total(),discT==='%'?total()*discV/100:discV);
const net=()=>total()-discAmt();
function updBar(){
  const b=$('#cb'),d=$('#dl');
  if(b){b.textContent='Charge '+rs(net());b.disabled=!Object.keys(cart).length}
  if(d)d.textContent=discAmt()>0?'Subtotal '+rs(total())+'  −  Discount '+rs(discAmt()):'';
}
function add(id){const i=find(id),q=cart[id]||0;if(q>=i.stock)return;cart[id]=q+1;render()}
function sub(id){if(--cart[id]<=0)delete cart[id];render()}

/* ---------- beep + scan ---------- */
let actx=null;
function beep(ok){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='square';o.frequency.value=ok?1800:400;g.gain.value=0.15;
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(ok?0.12:0.3));
  }catch(e){}
}
let stream=null,scanOn=false,scanCb=null,lastCode='',lastT=0;
function toast(m){const a=$('#smsg'),b=$('#hint');if(a)a.textContent=m;if(b)b.textContent=m}
async function openScan(cb){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  scanCb=cb;$('#scan').style.display='flex';toast('Camera khul raha hai…');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#vid');v.srcObject=stream;await v.play();
    const nat='BarcodeDetector' in window;const det=nat?new BarcodeDetector():new ZXing.BrowserMultiFormatReader();scanOn=true;toast('Barcode camera ke samne rakhein');
    const loop=async()=>{
      if(!scanOn)return;
      try{let c='';if(nat){const r=await det.detect(v);if(r.length)c=r[0].rawValue}else{try{c=det.decode(v).getText()}catch(z){}}if(c){if(c!==lastCode||Date.now()-lastT>2500){lastCode=c;lastT=Date.now();scanCb(c)}}}catch(e){}
      setTimeout(loop,250);
    };
    loop();
  }catch(e){
    toast(e.name==='NotAllowedError'||e.name==='SecurityError'?'Camera permission block hai. Is link ko seedha Chrome mein kholein aur Allow dabayein. Tab tak code neeche type karein.':'Camera nahi khula ('+(e.name||'error')+'). Code neeche type karein.');
  }
}
function closeScan(){scanOn=false;lastCode='';if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#scan').style.display='none'}
function scanAdd(code){
  code=String(code).trim();if(!code)return false;
  const i=items.find(x=>x.barcode===code);
  if(!i){beep(false);toast('Item nahi mila: '+code);return false}
  if((cart[i.id]||0)>=i.stock){beep(false);toast(i.name+': stock khatam');return false}
  add(i.id);beep(true);toast('Added: '+i.name);
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
  return true;
}
const scanBar=`<div style="display:flex;gap:8px"><input id="bc" placeholder="Scan / type barcode" inputmode="numeric" onkeydown="if(event.key==='Enter'){if(scanAdd(this.value))setTimeout(()=>$('#bc')&&$('#bc').focus(),0)}"><button style="margin-bottom:8px;white-space:nowrap" onclick="openScan(scanAdd)">📷 Scan</button></div><small id="hint" style="display:block;color:var(--mu);margin:-2px 4px 8px"></small>`;

/* ---------- checkout ---------- */
function openCO(){if(!Object.keys(cart).length)return;payM='Cash';payBank=0;cashRcv=0;coRender();$('#co').style.display='flex'}
function coRender(){
  const t=net();
  let h=`<h3 style="margin:0 0 10px;color:var(--tx);font-size:20px">Total ${rs(t)}</h3><div class="acts" style="margin-bottom:10px">${['Cash','Card','QR'].map(m=>`<button class="${payM===m?'':'g'}" onclick="payM='${m}';coRender()">${m}</button>`).join('')}</div>`;
  if(payM==='Cash')h+=`<input id="cr" type="number" inputmode="decimal" placeholder="Cash received (optional)" value="${cashRcv||''}" oninput="cashRcv=parseFloat(this.value)||0;$('#chg').textContent=rs(Math.max(0,cashRcv-net()))"><p style="margin:0 0 12px">Change: <b id="chg">${rs(Math.max(0,cashRcv-t))}</b></p>`;
  if(payM==='QR'){
    if(!qrs.length)h+='<p class="empty">Settings tab mein bank QR upload karein.</p>';
    else{
      const q=qrs.find(x=>x.id===payBank);
      h+=`<div class="acts" style="margin-bottom:6px">${qrs.map(x=>`<button class="${payBank===x.id?'':'g'}" onclick="payBank=${x.id};coRender()">${esc(x.bank)}</button>`).join('')}</div>`;
      if(q)h+=`<img class="qr" src="${q.img}"><p style="text-align:center;margin:0 0 10px">Scan karke <b>${rs(t)}</b> bhejein</p>`;
    }
  }
  h+=`<div class="acts"><button class="g" onclick="$('#co').style.display='none'">Cancel</button><button onclick="charge()">Complete sale</button></div>`;
  $('#cob').innerHTML=h;
}
function charge(){
  const q=qrs.find(x=>x.id===payBank);
  const pay=payM==='QR'?'QR'+(q?' ('+q.bank+')':''):payM;
  const lines=Object.entries(cart).map(([id,n])=>{const i=find(id);i.stock-=n;return{name:i.name,qty:n,price:i.price,cost:i.cost||0}});
  const sub=lines.reduce((a,l)=>a+l.qty*l.price,0),d=discAmt();
  const s={id:(sales.length?sales[sales.length-1].id:0)+1,date:Date.now(),sub,disc:d,total:sub-d,lines,pay,cash:payM==='Cash'?cashRcv:0};
  sales.push(s);cart={};discV=0;save();$('#co').style.display='none';render();showR(s);
}

/* ---------- receipt ---------- */
function rhtml(s){
  const ch=s.cash>s.total?s.cash-s.total:0,d=new Date(s.date);
  const L=(a,b)=>`<div class="ln"><span>${a}</span><span>${b}</span></div>`;
  let h=`<div class="rc"><h2>RECEIPT</h2>${cfg.name?`<div class="ctr hd" style="font-size:14px;margin:0">${esc(cfg.name).toUpperCase()}</div>`:''}${cfg.addr?`<div class="ctr" style="font-size:11.5px;margin:0">${esc(cfg.addr)}</div>`:''}${cfg.tel?`<div class="ctr" style="font-size:11.5px">Tel: ${esc(cfg.tel)}</div>`:''}<div class="dash"></div>`;
  h+=L('DATE:',d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}))+L('INVOICE:','#'+s.id)+'<div class="dash"></div>';
  h+='<div class="it hd"><span>QTY</span><span>DESC</span><span>PRICE</span></div>';
  h+=s.lines.map(l=>`<div class="it"><span>${l.qty}</span><span>${esc(l.name)}</span><span>${Math.round(l.qty*l.price)}</span></div>`).join('');
  h+='<div class="dash"></div>';
  if(s.disc>0)h+=L('SUBTOTAL',rs(s.sub))+L('DISCOUNT','-'+rs(s.disc));
  h+=`<div class="ln hd" style="font-size:15px"><span>TOTAL AMOUNT</span><span>${rs(s.total)}</span></div>`;
  if((s.pay||'Cash')==='Cash'){if(s.cash>0)h+=L('CASH',rs(s.cash))+L('CHANGE',rs(ch))}
  else h+=L('PAID BY',esc(s.pay));
  const rq=qrs.find(x=>x.id===cfg.rq);
  if(rq)h+=`<div class="dash"></div><div class="ctr hd">SCAN TO PAY</div><img src="${rq.img}" style="width:55%;display:block;margin:6px auto">`;
  h+='<div class="dash"></div><div class="ctr hd">THANK YOU FOR SHOPPING!</div></div>';
  return h;
}
function showR(s){cur=s;$('#rcv').innerHTML=rhtml(s);$('#mh').textContent='';$('#modal').style.display='flex'}
function closeM(){$('#modal').style.display='none'}
function msg(t){$('#mh').textContent=t}
async function shareR(){
  const t=$('#rcv').innerText;
  try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);msg('Copy ho gayi')}}catch(e){}
}
function doPrint(s){
  if(!s)return;
  const p=$('#prt');p.innerHTML=rhtml(s);p.style.width=(cfg.w==101?'4in':cfg.w+'mm');
  try{window.print()}catch(e){msg('Is page par print block hai. Apni GitHub website se try karein.')}
}
function escpos(s,img){
  const W=cfg.w==101?64:cfg.w==80?48:32,e=[];
  const tx=t=>e.push(...new TextEncoder().encode(t));
  const ln=(a,b)=>{a=String(a);b=String(b);tx(a.slice(0,Math.max(1,W-b.length-1)).padEnd(W-b.length)+b+'\n')};
  const dash=()=>tx('-'.repeat(W)+'\n');
  e.push(0x1b,0x40,0x1b,0x61,1,0x1b,0x45,1,0x1d,0x21,0x11);tx('RECEIPT\n');e.push(0x1d,0x21,0);
  if(cfg.name)tx(cfg.name.toUpperCase()+'\n');e.push(0x1b,0x45,0);
  tx((cfg.addr?cfg.addr+'\n':'')+(cfg.tel?'Tel: '+cfg.tel+'\n':''));e.push(0x1b,0x61,0);
  dash();ln('DATE:',new Date(s.date).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}));ln('INVOICE:','#'+s.id);dash();
  const pr=n=>String(Math.round(n));
  e.push(0x1b,0x45,1);ln('QTY  DESC','PRICE');e.push(0x1b,0x45,0);
  s.lines.forEach(l=>ln(String(l.qty).padEnd(5)+l.name,pr(l.qty*l.price)));dash();
  if(s.disc>0){ln('SUBTOTAL',pr(s.sub));ln('DISCOUNT','-'+pr(s.disc))}
  e.push(0x1b,0x45,1);ln('TOTAL AMOUNT','Rs '+pr(s.total));e.push(0x1b,0x45,0);
  dash();
  if((s.pay||'Cash')==='Cash'){if(s.cash>0){ln('CASH','Rs '+pr(s.cash));ln('CHANGE','Rs '+pr(Math.max(0,s.cash-s.total)));dash()}}else{ln('PAID BY',s.pay);dash()}
  e.push(0x1b,0x61,1);if(img){e.push(0x1b,0x45,1);tx('SCAN TO PAY\n');e.push(0x1b,0x45,0);e.push(...img);tx('\n');dash()}e.push(0x1b,0x45,1);tx('THANK YOU FOR SHOPPING!\n');e.push(0x1b,0x45,0);e.push(0x0a,0x0a,0x0a,0x0a);
  return new Uint8Array(e);
}
function qrRaster(){return new Promise(r=>{
  const q=qrs.find(x=>x.id===cfg.rq);if(!q)return r(null);
  const im=new Image();
  im.onload=()=>{
    const N=256,c=document.createElement('canvas');c.width=c.height=N;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,N,N);
    const k=Math.min(N/im.width,N/im.height),w=im.width*k,h=im.height*k;
    x.drawImage(im,(N-w)/2,(N-h)/2,w,h);
    const d=x.getImageData(0,0,N,N).data,bw=N/8,out=[0x1d,0x76,0x30,0,bw&255,bw>>8,N&255,N>>8];
    for(let y=0;y<N;y++)for(let b=0;b<bw;b++){let v=0;for(let j=0;j<8;j++){const p=(y*N+b*8+j)*4;v=(v<<1)|((d[p]*0.3+d[p+1]*0.6+d[p+2]*0.1)<128?1:0)}out.push(v)}
    r(out);
  };
  im.onerror=()=>r(null);im.src=q.img;
})}
async function btPrint(s){
  if(!s)return;
  try{
    if(!navigator.bluetooth){msg('Is browser mein Bluetooth print nahi. Android Chrome mein apni GitHub website kholein.');return}
    if(!btChar){
      msg('Printer chunein…');
      const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xff00,0xffe0,0x18f0,'49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2']});
      const srv=await dev.gatt.connect();
      for(const sv of await srv.getPrimaryServices()){
        for(const ch of await sv.getCharacteristics()){if(ch.properties.write||ch.properties.writeWithoutResponse){btChar=ch;break}}
        if(btChar)break;
      }
      if(!btChar)throw new Error('Printer ka write channel nahi mila');
    }
    const data=escpos(s,await qrRaster());
    for(let i=0;i<data.length;i+=100){
      const part=data.slice(i,i+100);
      if(btChar.properties.writeWithoutResponse)await btChar.writeValueWithoutResponse(part);else await btChar.writeValue(part);
    }
    msg('Print bhej di gayi');
  }catch(e){btChar=null;msg('Print nahi hui: '+(e.message||e.name))}
}

/* ---------- items ---------- */
function addItem(){
  const n=$('#n').value.trim();if(!n)return;
  const bc=$('#b').value.trim();
  if(bc&&items.some(i=>i.barcode===bc)){$('#n').placeholder='Ye barcode pehle se hai';$('#b').value='';return}
  const id=items.reduce((m,i)=>Math.max(m,i.id),0)+1;
  items.push({id,name:n,barcode:bc,cost:parseFloat($('#c').value)||0,price:parseFloat($('#p').value)||0,stock:parseInt($('#s').value)||0});
  items.sort((a,b)=>a.name.localeCompare(b.name));save();render();
}
function restock(id){find(id).stock+=10;save();render()}
function del(id){
  if(delId!==id){delId=id;render();return}
  items=items.filter(i=>i.id!==id);delete cart[id];delId=null;save();render();
}
function addQR(inp){
  const f=inp.files[0],bank=$('#qn').value.trim();inp.value='';
  if(!f)return;
  if(!bank){$('#qh').textContent='Pehle bank ka naam likhein, phir image chunein.';return}
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const k=Math.min(1,600/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    qrs.push({id:Date.now(),bank,img:c.toDataURL('image/jpeg',.9)});
    URL.revokeObjectURL(u);S.set('qrs',qrs);render();
  };
  img.src=u;
}

/* ---------- views ---------- */
function vSale(){
  if(!items.length)return '<p class="empty">Pehle Items tab mein item add karein.</p>';
  return items.map(i=>{const q=cart[i.id]||0;
    return `<div class="row ${i.stock<1?'off':''}" onclick="add(${i.id})"><div><b>${esc(i.name)}</b><small>${rs(i.price)} · Stock ${i.stock}</small></div>${q?`<div class="qty"><button onclick="event.stopPropagation();sub(${i.id})">−</button><b>${q}</b></div>`:''}</div>`}).join('');
}
function vItems(){
  const form=`<div class="card"><input id="n" placeholder="Item name"><div style="display:flex;gap:8px"><input id="b" placeholder="Barcode (optional)" inputmode="numeric"><button class="g" style="margin-bottom:8px" onclick="openScan(c=>{beep(true);$('#b').value=c;closeScan()})">📷</button></div><input id="c" type="number" inputmode="decimal" placeholder="Purchase price (kharid)"><div class="grid"><input id="p" type="number" inputmode="decimal" placeholder="Sale price"><input id="s" type="number" inputmode="numeric" placeholder="Stock"></div><button style="width:100%" onclick="addItem()">Add item</button></div>`;
  return form+items.map(i=>`<div class="row"><div><b>${esc(i.name)}</b><small>Sale ${rs(i.price)} · Kharid ${rs(i.cost||0)}${i.barcode?' · '+esc(i.barcode):''} · Stock <span class="${i.stock<=5?'low':''}">${i.stock}${i.stock<=5?' ⚠':''}</span></small></div><div class="acts"><button class="g" style="min-width:0" onclick="restock(${i.id})">+10</button><button class="g" style="min-width:0" onclick="del(${i.id})">${delId===i.id?'Sure?':'Delete'}</button></div></div>`).join('');
}
function vReport(){
  const today=new Date().toDateString();
  const ts=sales.filter(s=>new Date(s.date).toDateString()===today);
  const sum=ts.reduce((a,s)=>a+s.total,0);
  const prof=ts.reduce((a,s)=>a+s.total-s.lines.reduce((b,l)=>b+l.qty*(l.cost||0),0),0);
  const top={};ts.forEach(s=>s.lines.forEach(l=>top[l.name]=(top[l.name]||0)+l.qty));
  const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const low=items.filter(i=>i.stock<=5);
  return `<div class="grid"><div class="card"><small>Today’s sales</small><div class="big">${rs(sum)}</div></div><div class="card"><small>Orders</small><div class="big">${ts.length}</div></div></div><div class="card"><small>Profit (munafa)</small><div class="big">${rs(prof)}</div></div>
  <h3>TOP ITEMS TODAY</h3>${tl.length?tl.map(([n,q])=>`<div class="row"><b>${esc(n)}</b><span>${q} sold</span></div>`).join(''):'<p class="empty">Aaj koi sale nahi.</p>'}
  <h3>LOW STOCK</h3>${low.length?low.map(i=>`<div class="row"><b>${esc(i.name)}</b><span class="low">${i.stock} left</span></div>`).join(''):'<p class="empty">Sab theek hai.</p>'}
  <h3>TODAY’S RECEIPTS</h3>${ts.slice().reverse().map(s=>`<div class="row" onclick="showR(sales.find(x=>x.id==${s.id}))"><div><b>#${s.id}</b><small>${new Date(s.date).toLocaleTimeString()} · ${esc(s.pay||'Cash')}</small></div><b>${rs(s.total)}</b></div>`).join('')}`;
}
function vSet(){
  const f=(k,p)=>`<input placeholder="${p}" value="${esc(cfg[k])}" oninput="cfg.${k}=this.value;S.set('cfg',cfg)">`;
  return `<div class="card"><h3 style="margin:0 0 8px">Shop details (receipt par)</h3>${f('name','Shop name')}${f('addr','Address')}${f('tel','Phone')}<select onchange="cfg.w=+this.value;S.set('cfg',cfg)"><option value="58" ${cfg.w==58?'selected':''}>Paper 58mm</option><option value="80" ${cfg.w==80?'selected':''}>Paper 80mm</option><option value="101" ${cfg.w==101?'selected':''}>Paper 4 inch</option></select><select onchange="cfg.rq=+this.value;S.set('cfg',cfg)"><option value="0">Receipt par QR: nahi</option>${qrs.map(q=>`<option value="${q.id}" ${cfg.rq==q.id?'selected':''}>Receipt par QR: ${esc(q.bank)}</option>`).join('')}</select></div>
  <div class="card"><h3 style="margin:0 0 8px">Bank QR (scan to pay)</h3><input id="qn" placeholder="Bank ka naam (jaise HBL, Easypaisa)"><input id="qf" type="file" accept="image/*" hidden onchange="addQR(this)"><button style="width:100%" onclick="$('#qf').click()">Upload QR image</button><small id="qh" style="display:block;color:var(--mu);margin-top:6px"></small>
  ${qrs.map(q=>`<div class="row" style="margin-top:8px"><div style="display:flex;gap:10px;align-items:center"><img src="${q.img}" style="width:48px;height:48px;border-radius:6px"><b>${esc(q.bank)}</b></div><button class="g" onclick="qrs=qrs.filter(x=>x.id!==${q.id});S.set('qrs',qrs);render()">Delete</button></div>`).join('')}</div>`;
}
function render(){
  $('#title').textContent={sale:'Sale',items:'Items',report:'Daily report',set:'Settings'}[tab];
  $('#view').innerHTML=(tab==='sale'&&items.length?scanBar:'')+{sale:vSale,items:vItems,report:vReport,set:vSet}[tab]();
  const t=total();
  $('#bar').innerHTML=tab==='sale'?`<div style="display:flex;gap:8px;margin-bottom:6px"><input id="dv" type="number" inputmode="decimal" placeholder="Discount (jitna chahein)" value="${discV||''}" oninput="discV=parseFloat(this.value)||0;updBar()"><select onchange="discT=this.value;updBar()"><option ${discT==='Rs'?'selected':''}>Rs</option><option ${discT==='%'?'selected':''}>%</option></select></div><small id="dl" style="display:block;color:var(--mu);margin-bottom:6px"></small><button id="cb" ${t?'':'disabled'} onclick="openCO()">Charge ${rs(net())}</button>`:'';
  updBar();
  $('#nav').innerHTML=[['sale','🛒','Sale'],['items','📦','Items'],['report','📊','Report'],['set','⚙️','Settings']].map(([k,e,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';delId=null;render()">${e}<br>${l}</button>`).join('');
}
render();
</script>
</body>
</html>
